<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkly Pink Login</title>

  <style>
    /* ===========================
       Reset
    =========================== */
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      min-height:100vh;
      background:linear-gradient(135deg,#ffe4ef,#ffd6e8,#ffc2dd);
      overflow:hidden;
    }

    /* ===========================
       Login Card
    =========================== */
    main{
      position:relative;
      width:100%;
      max-width:420px;
      padding:2.5rem;
      border-radius:22px;
      background:rgba(255,240,247,.92);
      backdrop-filter:blur(10px);
      border:2px solid #f9a8d4;
      overflow:hidden;

      box-shadow:
              0 0 20px rgba(255,105,180,.4),
              0 0 45px rgba(255,182,193,.35),
              0 15px 35px rgba(236,72,153,.25);

      animation:float 4s ease-in-out infinite;
    }

    /* Sparkles */
    main::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;

      background-image:
              radial-gradient(circle,white 2px,transparent 3px),
              radial-gradient(circle,#fff6b0 2px,transparent 3px),
              radial-gradient(circle,#ff69b4 2px,transparent 3px),
              radial-gradient(circle,#ffffff 2px,transparent 3px);

      background-size:
              140px 140px,
              180px 180px,
              160px 160px,
              200px 200px;

      animation:twinkle 3s ease-in-out infinite;
    }

    main::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:22px;
      pointer-events:none;

      box-shadow:
              0 0 15px #ffb6d9,
              0 0 30px #ff69b4,
              0 0 50px #ffd1e8;

      animation:glow 2s infinite alternate;
    }

    h1{
      text-align:center;
      color:#be185d;
      margin-bottom:1.8rem;
      text-shadow:0 0 10px white;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    label{
      display:block;
      margin-bottom:6px;
      color:#9d174d;
      font-weight:600;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:2px solid #f9a8d4;
      background:white;
      font-size:16px;
      transition:.3s;
    }

    input:focus{
      outline:none;
      border-color:#ec4899;
      box-shadow:0 0 15px rgba(236,72,153,.4);
    }

    /* ===========================
       Button
    =========================== */
    button{
      padding:14px;
      border:none;
      border-radius:10px;
      font-size:18px;
      font-weight:bold;
      color:white;
      cursor:pointer;

      background:linear-gradient(135deg,#ec4899,#db2777);
      transition:.3s;
    }

    button:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 20px rgba(219,39,119,.35);
    }

    button:active{
      transform:scale(.97);
    }

    /* Explosion */
    button.explode{
      animation:explode .8s forwards;
    }

    @keyframes explode{
      0%{
        transform:scale(1);
        filter:brightness(1);
      }

      20%{
        transform:scale(1.3);
        filter:brightness(2);
        box-shadow:
                0 0 20px hotpink,
                0 0 40px deeppink,
                0 0 60px white;
      }

      100%{
        transform:scale(0);
        opacity:0;
      }
    }

    /* Flying particles */
    .spark{
      position:fixed;
      width:8px;
      height:8px;
      border-radius:50%;
      pointer-events:none;
      animation:fly .8s ease-out forwards;
    }

    @keyframes fly{
      from{
        transform:translate(0,0) scale(1);
        opacity:1;
      }

      to{
        transform:translate(var(--x),var(--y)) scale(0);
        opacity:0;
      }
    }

    /* Footer */
    footer{
      margin-top:25px;
      color:#9d174d;
    }

    /* Card animations */
    @keyframes glow{
      from{
        box-shadow:
                0 0 15px #ffb6d9,
                0 0 30px #ff69b4;
      }

      to{
        box-shadow:
                0 0 25px #ffd1e8,
                0 0 50px #ff69b4,
                0 0 70px #ffc0cb;
      }
    }

    @keyframes twinkle{
      0%{opacity:.4;}
      50%{opacity:1;}
      100%{opacity:.5;}
    }

    @keyframes float{
      0%,100%{transform:translateY(0);}
      50%{transform:translateY(-8px);}
    }
  </style>

</head>
<body>

<main>

  <h1>✨ Login ✨</h1>

  <form id="loginForm">

    <div>
      <label for="username">Username</label>
      <input
              type="text"
              id="username"
              required
              placeholder="Enter username">
    </div>

    <div>
      <label for="password">Password</label>
      <input
              type="password"
              id="password"
              required
              placeholder="Enter password">
    </div>

    <button id="loginBtn" type="submit">
      💖 Login 💖
    </button>

  </form>

</main>

<footer>
  © July 30, 2026 • Emily ✨
</footer>

<script>
  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginBtn");

  form.addEventListener("submit", function(e){

    e.preventDefault();

    const rect = button.getBoundingClientRect();

    // Create 60 spark particles
    for(let i=0;i<60;i++){

      const spark=document.createElement("div");
      spark.className="spark";

      spark.style.left=(rect.left+rect.width/2)+"px";
      spark.style.top=(rect.top+rect.height/2)+"px";

      spark.style.background=`hsl(${Math.random()*360},100%,70%)`;

      spark.style.setProperty("--x",(Math.random()-.5)*450+"px");
      spark.style.setProperty("--y",(Math.random()-.5)*450+"px");

      document.body.appendChild(spark);

      spark.addEventListener("animationend",()=>spark.remove());
    }

    button.classList.add("explode");

    // Restore button after animation
    setTimeout(()=>{
      button.classList.remove("explode");
      button.style.opacity="1";
      button.style.transform="scale(1)";
      alert("Login successful! 🎉");
    },800);

  });
</script>

</body>
</html>
