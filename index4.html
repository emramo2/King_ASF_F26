<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GalacticSummit</title>
</head>


<style>
    body {
        background-color: black;
        color: white;
    }
</style>
<h1 style="font-size: 2rem; background: linear-gradient(to right, grey, white); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
    Galactic Summit Registration
</h1>
<hr>




<body>

<form action ="/api/getData" method="POST">

    <p></p>
    <label>
        Representative Name:<input type="text" name="representative_name" id=""max="20"required>
    </label>
    <p></p>
    <label>
       Galactic Communications: <input type="email" name="galactic_communications" id=""max="100"required>
    </label>
    <p></p>
    <label>
        Alliance: <input type="text" name="" id=""max="20">
    </label>
    <p></p>
    <p>
        <label>Alliance:</label>

        <input type="radio" name="alliance_name" value="Star Wars" id="sw">
        <label for="sw">Star Wars</label>

        <input type="radio" name="alliance_name" value="Star Trek" id="st">
        <label for="st">Star Trek</label>

        <input type="radio" name="alliance_name" value="Snacks" id="sn">
        <label for="sn">Snacks</label>
    </p>

    <p></p>
    <label>
        Crew Size Attending: <input type="number" name="crew_size_attending" min="1" max="8" id="">
    </label>
    <p></p>
    <label>
        Summit Updates:
        <input type="checkbox" name="summit_updates" value="true" id="">
    </label>


<p>
<button type="reset">RESET</button>
<button type="submit">SUBMIT</button>

</form>
</body>



</html>
